apiVersion: apps/v1
kind: Deployment

metadata:
  name: platforms-mssql-depl

spec:
  replicas: 1

  selector:
    matchLabels:
      app: platforms-mssql

  template:
    metadata:
      labels:
        app: platforms-mssql

    spec:
      containers:
        - name: platforms-mssql
          image: mcr.microsoft.com/mssql/server:2022-latest

          ports:
            - containerPort: 1433

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platforms-mssql-secret
                  key: SA_PASSWORD

          volumeMounts:
            - name: platforms-mssql-storage
              mountPath: /var/opt/mssql

      volumes:
        - name: platforms-mssql-storage
          persistentVolumeClaim:
            claimName: platforms-mssql-claim

---
apiVersion: v1
kind: Service

metadata:
  name: platforms-mssql-clusterip-srv

spec:
  type: ClusterIP

  selector:
    app: platforms-mssql

  ports:
    - name: mssql
      protocol: TCP
      port: 1433
      targetPort: 1433