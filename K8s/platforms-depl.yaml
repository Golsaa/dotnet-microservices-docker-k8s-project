apiVersion: apps/v1
kind: Deployment

metadata:
  name: platforms-depl

spec:
  replicas: 1

  selector:
    matchLabels:
      app: platformservice

  template:
    metadata:
      labels:
        app: platformservice

    spec:
      containers:
        - name: platformservice
          image: gomore2/platformservice:v5

          env:
            - name: Kafka__BootstrapServers
              value: "kafka-clusterip-srv:9092"

            - name: Kafka__Topic
              value: "platform-published"
---
apiVersion: v1
kind: Service
metadata:
  name: platforms-clusterip-srv
spec:
  type: ClusterIP
  selector: 
    app: platformservice
  ports:
  - name: platformservice
    protocol: TCP
    port: 80
    targetPort: 80

