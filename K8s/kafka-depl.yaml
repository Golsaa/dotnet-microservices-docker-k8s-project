apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1

          ports:
            - containerPort: 9092
              name: internal

            - containerPort: 29092
              name: external

            - containerPort: 9093
              name: controller

          env:
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-clusterip-srv:9092,EXTERNAL://localhost:29092"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-clusterip-srv:9093"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"

            - name: CLUSTER_ID
              value: "4L6g3nShT-eMCtK--X86sw"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-clusterip-srv
spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: internal
      protocol: TCP
      port: 9092
      targetPort: 9092

    - name: external
      protocol: TCP
      port: 29092
      targetPort: 29092

    - name: controller
      protocol: TCP
      port: 9093
      targetPort: 9093